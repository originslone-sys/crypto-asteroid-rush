<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Campaign Game — Test</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #04060f;
      --canvas-w: 414px;
      --canvas-h: 896px;
      --text: #e7eaff;
      --muted: #8a93c8;
      --accent: #5cd5ff;
      --ok: #5fdb91;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; min-height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    /* Centraliza o canvas portrait. No desktop, fundo blur do
       gameplay; no mobile, cobre a tela toda. */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(80,40,180,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(180,40,120,0.2)  0%, transparent 50%),
        #04060f;
    }
    .frame {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      max-width: 100vw;
      max-height: 100dvh;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(92,213,255,0.18);
    }
    @media (max-width: 480px) {
      .frame { border-radius: 0; box-shadow: none; }
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
      background: #04060f;
      touch-action: none;
    }

    /* Overlays */
    .overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(4,6,15,0.85);
      backdrop-filter: blur(6px);
      z-index: 5; padding: 24px;
    }
    .overlay .card {
      max-width: 360px; width: 100%;
      background: rgba(20,28,72,0.85);
      border: 1px solid #2a3375;
      border-radius: 14px; padding: 22px;
      text-align: center;
    }
    .overlay h2 { margin: 0 0 8px; font-size: 18px; letter-spacing: 0.05em; }
    .overlay p  { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
    .overlay .btn {
      display: inline-block; margin-top: 8px;
      background: linear-gradient(135deg, #1c4cff 0%, #5b1a8a 100%);
      color: #fff; border: none; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; cursor: pointer;
      text-decoration: none;
    }
    .overlay .btn.secondary {
      background: #1f2766; border: 1px solid #2a3375;
    }
    .overlay .btn.danger {
      background: #4a1a1a; border: 1px solid #6e2424; color: #ffb1b1;
    }
    .overlay .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 12px 0 16px; font-size: 12px;
    }
    .overlay .stats > div {
      background: #050720; border: 1px solid #1f2766;
      border-radius: 6px; padding: 8px;
    }
    .overlay .stats strong { display: block; color: var(--accent); font-size: 14px; margin-bottom: 2px; }
    .stars { font-size: 28px; letter-spacing: 6px; margin: 4px 0 8px; }
    .stars .lit { color: #ffd166; }
    .stars .off { color: #2a3375; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; background: #5b1a8a; color: #fff; }
    .err { color: var(--err); }
    .small { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .pause-btn {
      position: absolute; top: 14px; right: 14px; z-index: 4;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: 1px solid #2a3375;
      color: #fff; font-size: 14px; cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

<div class="stage">
  <div class="frame">
    <canvas id="game" width="414" height="896"></canvas>

    <button class="pause-btn" id="btn-pause" title="Pausar">⏸</button>

    <!-- Overlay: idle/login -->
    <div class="overlay" id="ov-idle">
      <div class="card">
        <h2>🚀 Campaign — Test</h2>
        <span class="badge">isolado</span>
        <p style="margin-top:10px">
          Página de teste do gameplay. Acesse com
          <code style="color:var(--accent)">?stage=s1f1</code> (ou outra fase ativa).
        </p>
        <div id="prelaunch-meta" class="small">Verificando...</div>
        <div class="row">
          <button class="btn" id="btn-login">Login com Google</button>
        </div>
        <div class="row">
          <button class="btn" id="btn-start" style="display:none">Iniciar fase</button>
          <a class="btn secondary" href="campaign.html">Voltar ao mapa</a>
        </div>
      </div>
    </div>

    <!-- Overlay: result (preenchido em runtime) -->
    <div class="overlay" id="ov-result" style="display:none">
      <div class="card">
        <h2 id="res-title">—</h2>
        <div class="stars" id="res-stars">★ ★ ★</div>
        <div class="stats">
          <div><strong id="res-brl">R$ 0,00</strong>BRL</div>
          <div><strong id="res-xp">+0</strong>XP</div>
          <div><strong id="res-time">0s</strong>tempo</div>
          <div><strong id="res-combo">x1</strong>combo</div>
          <div><strong id="res-enemies">0</strong>destruídos</div>
          <div><strong id="res-lives">5</strong>vidas</div>
        </div>
        <div id="res-flag" class="small"></div>
        <div class="row">
          <button class="btn" id="btn-retry">Jogar de novo</button>
          <a class="btn secondary" href="campaign.html">Sair</a>
        </div>
      </div>
    </div>

    <!-- Overlay: error -->
    <div class="overlay" id="ov-error" style="display:none">
      <div class="card">
        <h2 class="err">Erro</h2>
        <p id="err-msg">—</p>
        <div class="row">
          <button class="btn secondary" onclick="location.reload()">Recarregar</button>
          <a class="btn secondary" href="campaign.html">Sair</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-manager.js"></script>

<!-- Engine + assets -->
<script src="js/campaign-asset-loader.js"></script>
<script src="js/campaign-engine.js"></script>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const STAGE_ID = params.get('stage') || 's1f1';

  const els = {
    ovIdle:   document.getElementById('ov-idle'),
    ovResult: document.getElementById('ov-result'),
    ovError:  document.getElementById('ov-error'),
    errMsg:   document.getElementById('err-msg'),
    btnLogin: document.getElementById('btn-login'),
    btnStart: document.getElementById('btn-start'),
    btnRetry: document.getElementById('btn-retry'),
    preMeta:  document.getElementById('prelaunch-meta'),
    canvas:   document.getElementById('game'),
    pauseBtn: document.getElementById('btn-pause'),
    resTitle: document.getElementById('res-title'),
    resStars: document.getElementById('res-stars'),
    resBrl:   document.getElementById('res-brl'),
    resXp:    document.getElementById('res-xp'),
    resTime:  document.getElementById('res-time'),
    resCombo: document.getElementById('res-combo'),
    resEnem:  document.getElementById('res-enemies'),
    resLives: document.getElementById('res-lives'),
    resFlag:  document.getElementById('res-flag'),
  };

  let currentSession = null;  // { session_token, stage, ... }

  // ----- helpers -----
  function showOverlay(name) {
    els.ovIdle.style.display   = name === 'idle'   ? 'flex' : 'none';
    els.ovResult.style.display = name === 'result' ? 'flex' : 'none';
    els.ovError.style.display  = name === 'error'  ? 'flex' : 'none';
  }
  function showError(msg) {
    els.errMsg.textContent = msg || 'Erro desconhecido';
    showOverlay('error');
  }
  function uid() {
    return window.authManager && window.authManager.currentUser
      ? window.authManager.currentUser.uid
      : null;
  }
  function fmtBrl(v) {
    return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ',');
  }
  function setStarsUi(stars) {
    const arr = ['off','off','off'];
    for (let i = 0; i < stars; i++) arr[i] = 'lit';
    els.resStars.innerHTML = arr.map(c =>
      '<span class="' + c + '">★</span>'
    ).join(' ');
  }

  // ----- preload assets -----
  const EXTRA_KEYS = [
    'ship_default', 'player_bullet', 'enemy_bullet',
    'powerup_shield', 'powerup_triple_shot', 'powerup_repair',
    'powerup_bomb', 'powerup_slow_time',
    'boss_asteroid_mother', 'boss_junk_devourer',
  ];
  const ALL_BEHAVIORS = ['tank','bullet','kamikaze','shooter','dodger'];

  async function preloadAssets() {
    if (!window.CampaignAssets) throw new Error('CampaignAssets não carregado');
    await CampaignAssets.preloadForStage(1, ALL_BEHAVIORS, EXTRA_KEYS);
  }

  // ----- start flow -----
  async function startStage() {
    const u = uid();
    if (!u) { showError('Faça login antes de iniciar.'); return; }
    els.preMeta.textContent = 'Iniciando sessão...';
    try {
      const fd = new FormData();
      fd.set('google_uid', u);
      fd.set('stage_id', STAGE_ID);
      const r = await fetch('/api/campaign-start.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) {
        showError(data.error || 'Falha ao iniciar');
        return;
      }
      currentSession = data.data;
      showOverlay('none');
      els.ovIdle.style.display = 'none';
      els.pauseBtn.style.display = 'block';

      // Sprites do setor da fase (recarrega no caso de fase de outro setor)
      await CampaignAssets.preloadForStage(data.data.stage.sector || 1, ALL_BEHAVIORS, EXTRA_KEYS);

      CampaignEngine.start({
        canvas: els.canvas,
        stage: data.data.stage,
        totalEnemies: 8,
        onEnd: handleEnd,
      });
    } catch (e) {
      showError('Erro de rede: ' + e.message);
    }
  }

  // ----- end flow -----
  async function handleEnd(payload) {
    if (!currentSession) return;
    els.pauseBtn.style.display = 'none';
    const fd = new FormData();
    fd.set('google_uid', uid());
    fd.set('session_token', currentSession.session_token);
    fd.set('result',           payload.result);
    fd.set('damage_taken',     String(payload.damage_taken));
    fd.set('time_elapsed',     String(payload.time_elapsed));
    fd.set('enemies_destroyed',String(payload.enemies_destroyed));
    fd.set('max_combo',        String(payload.max_combo));
    try {
      const r = await fetch('/api/campaign-end.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) {
        showError('campaign-end: ' + (data.error || 'erro'));
        return;
      }
      renderResult(data.data, payload);
    } catch (e) {
      showError('Erro de rede ao finalizar: ' + e.message);
    }
  }

  function renderResult(serverData, clientPayload) {
    els.resTitle.textContent = serverData.result === 'win' ? '🏆 Vitória!' : '💀 Derrota';
    setStarsUi(serverData.stars);
    els.resBrl.textContent  = fmtBrl(serverData.brl_awarded);
    els.resXp.textContent   = '+' + serverData.xp_awarded + (serverData.level_up ? ' ⬆' : '');
    els.resTime.textContent = clientPayload.time_elapsed + 's';
    els.resCombo.textContent= 'x' + clientPayload.max_combo;
    els.resEnem.textContent = clientPayload.enemies_destroyed;
    els.resLives.textContent= serverData.lives_left;
    els.resFlag.innerHTML   = serverData.suspicious
      ? '<span class="err">⚠ Sessão marcada como REVIEW (suspeita).</span>'
      : '';
    showOverlay('result');
    currentSession = null;
  }

  // ----- auth UI -----
  function refreshIdleUi() {
    const u = uid();
    if (u) {
      els.btnLogin.style.display = 'none';
      els.btnStart.style.display = 'inline-block';
      els.preMeta.textContent = 'Logado · stage_id=' + STAGE_ID + ' · pronto para iniciar.';
    } else {
      els.btnLogin.style.display = 'inline-block';
      els.btnStart.style.display = 'none';
      els.preMeta.textContent = 'Faça login para iniciar.';
    }
  }

  function bindUI() {
    els.btnLogin.addEventListener('click', () => window.authManager.signIn());
    els.btnStart.addEventListener('click', startStage);
    els.btnRetry.addEventListener('click', () => {
      showOverlay('idle');
      refreshIdleUi();
    });
  }

  // ----- boot -----
  function bindAuth(retries = 50) {
    if (!window.authManager) {
      if (retries <= 0) return;
      setTimeout(() => bindAuth(retries - 1), 100);
      return;
    }
    window.authManager.onAuthStateChanged(refreshIdleUi);
    refreshIdleUi();
  }

  showOverlay('idle');
  els.preMeta.textContent = 'Pré-carregando sprites...';
  bindUI();
  preloadAssets()
    .then(() => bindAuth())
    .catch((e) => showError('Falha no preload: ' + e.message));
})();
</script>

</body>
</html>
