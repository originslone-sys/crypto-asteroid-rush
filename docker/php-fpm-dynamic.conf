[www]
; ===========================================
; PHP-FPM Base Configuration (Cloud Run)
; Valores podem ser sobrescritos pelo auto-scale.sh
; ===========================================

user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; ===========================================
; Process Manager
; ===========================================
pm = dynamic

; Baseline seguro (o auto-scale.sh pode aumentar conforme RAM/CPU)
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Reciclagem para evitar leaks/fragmentação
pm.max_requests = 1000

; ===========================================
; Timeouts (evita requests travadas e ajuda diagnóstico)
; ===========================================
; Mata request que ficou presa tempo demais (segurança operacional)
request_terminate_timeout = 90s

; Loga stacktrace de scripts lentos
request_slowlog_timeout = 3s
slowlog = /dev/stderr

; ===========================================
; Status/Ping (opcional)
; Se quiser manter /fpm-status e /fpm-ping no nginx, habilite:
; ===========================================
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; ===========================================
; Logging
; ===========================================
; Em Cloud Run, prefira o access_log do nginx.
; Se quiser manter, ok, mas pode gerar muito volume.
access.log = /dev/stdout

; ===========================================
; Ambiente / Output
; ===========================================
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
