# ===========================================
# Nginx Configuration - Crypto Asteroid Rush
# Otimizado para alta performance + auto-scale
# Cloud Run compatible
# ===========================================

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # [CLOUDRUN] Capturar IP real do cliente para rate-limit/logs
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Logging formato otimizado
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    
    access_log /dev/stdout main;
    
    # Performance básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;

    # [HARDEN] Não expor versão
    server_tokens off;
    
    # Buffers otimizados
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ===========================================
    # RATE LIMITING ZONES
    # ===========================================
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=game_events:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # ===========================================
    # UPSTREAM PHP-FPM
    # ===========================================
    upstream php-fpm {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    # PvP Game Server (Node.js + Socket.io na VM — IP público da VM)
    upstream pvp_game_server {
        server 34.138.147.143:3000;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;
        root /app;
        index index.php index.html;

        # Limite de conexões simultâneas por IP
        limit_conn conn_limit 30;

        # Headers de segurança
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ============================================
        # HEALTH CHECKS
        # ============================================
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }

        set $internal_ok 0;
        if ($arg_token != "") { set $internal_ok 1; }
        if ($http_x_internal_token != "") { set $internal_ok 1; }

        location = /fpm-status {
            access_log off;
            if ($internal_ok = 0) { return 403; }
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location = /fpm-ping {
            access_log off;
            if ($internal_ok = 0) { return 403; }
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # ============================================
        # ARQUIVOS ESTÁTICOS - Cache agressivo
        # ============================================

        # MODO CAMPANHA: enquanto em desenvolvimento iterativo, sem
        # cache de assets para que o user veja mudanças imediatamente.
        # Quando estabilizar e for pra público, remover este bloco
        # (volta a usar a regra agressiva genérica abaixo).
        location ~* ^/img/campaign/.+\.(png|jpg|jpeg|gif|svg|webp)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            access_log off;
            try_files $uri =404;
        }

        location ~* ^/js/campaign-.+\.js$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public";
            add_header Vary "Accept-Encoding";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ============================================
        # API ENDPOINTS
        # ============================================

        location = /api/zettpay-webhook.php {
            if ($request_method !~ ^(POST)$ ) { return 405; }
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30;
            fastcgi_keep_conn on;
        }

        location = /api/reconcile-deposits.php {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 120;
            fastcgi_send_timeout 120;
            fastcgi_keep_conn on;
        }

        location = /api/auto-withdraw.php {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 120;
            fastcgi_send_timeout 120;
            fastcgi_keep_conn on;
        }

        location = /api/withdrawal-queue.php {
            if ($request_method !~ ^(GET|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 10;
            fastcgi_keep_conn on;
        }

        location ~ ^/api/.*\.php$ {
            if ($request_method !~ ^(GET|POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=20 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30;
            fastcgi_keep_conn on;
        }

        location = /api/game-event.php {
            if ($request_method !~ ^(POST|OPTIONS)$ ) { return 405; }
            limit_req zone=game_events burst=100 nodelay;
            limit_conn conn_limit 10;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 10;
            fastcgi_send_timeout 10;
            fastcgi_keep_conn on;
        }

        location = /api/game-start.php {
            if ($request_method !~ ^(POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=30 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30;
            fastcgi_keep_conn on;
        }

        location = /api/game-end.php {
            if ($request_method !~ ^(POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=30 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 60;
            fastcgi_send_timeout 60;
            fastcgi_keep_conn on;
        }

        # PvP WebSocket proxy
        location /pvp-ws/ {
            proxy_pass http://pvp_game_server/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_connect_timeout 10;
        }

        location = /api/pvp-info.php {
            if ($request_method !~ ^(GET|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=10 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 10;
            fastcgi_keep_conn on;
        }

        location ~ ^/api/pvp-.*\.php$ {
            if ($request_method !~ ^(POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=20 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30;
            fastcgi_keep_conn on;
        }

        location ~ ^/admin/.*\.php$ {
            if ($request_method !~ ^(GET|POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=30 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 120;
            fastcgi_keep_conn on;
        }

        location ~ ^/phpmyadmin/.*\.php$ {
            if ($request_method !~ ^(GET|POST|OPTIONS)$ ) { return 405; }
            limit_req zone=api_limit burst=5 nodelay;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 120;
            fastcgi_keep_conn on;
        }

        location ~ \.php$ {
            limit_req zone=api_limit burst=20 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 30;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_keep_conn on;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ \.(env|log|ini|conf|sh)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/docker/ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
