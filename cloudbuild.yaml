steps:
  # 1) Build da imagem (Dockerfile)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'
      - '.'

  # 2) Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'

  # 3) Deploy no Cloud Run usando a imagem (sem --source)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crypto-asteroid'
      - '--image'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - 'project-7be1cae5-5f08-45fb-aca:us-west1:unobix'
      # Runtime tuning (ajuste depois)
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--concurrency'
      - '40'
      - '--timeout'
      - '120'
      - '--set-env-vars'
      - >-
        CLOUDSQL_INSTANCE=project-7be1cae5-5f08-45fb-aca:us-west1:unobix,
        MYSQLHOST=34.168.76.127,
        MYSQLPORT=3306,
        MYSQLDATABASE=unobix_db,
        MYSQLUSER=unobix_user,
        MYSQLPASSWORD=YyZD3H)dndSo*A/N,
        FIREBASE_PROJECT_ID=unobix-oauth-a69cd,
        FIREBASE_API_KEY=AIzaSyCFUE9xXtbjJGQTz4nGgveWJx6DuhOqD2U,
        GAME_SECRET_KEY=game_secret_production_2025,
        ADMIN_PASSWORD=admin_secure_password_2025,
        APP_ENV=production,
        DEBUG=false,
        RECONCILE_CRON_TOKEN=rcn_unobix_7f3a9c2e1b5d8k4m

  # 4) Criar/Atualizar Cloud Scheduler para reconciliação de depósitos (a cada 10 min)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs delete reconcile-deposits --location=us-west1 --quiet 2>/dev/null || true
        gcloud scheduler jobs create http reconcile-deposits \
          --location=us-west1 \
          --schedule="*/10 * * * *" \
          --uri="https://crypto-asteroid-234282032979.us-west1.run.app/api/reconcile-deposits.php?token=rcn_unobix_7f3a9c2e1b5d8k4m" \
          --http-method=GET \
          --attempt-deadline=120s \
          --description="Verifica depositos pendentes na ZettPay a cada 10 minutos"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 900s

images:
  - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'
