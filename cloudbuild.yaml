# ===========================================
# Cloud Build Configuration for Crypto Asteroid Rush
# Deploy to Cloud Run with Cloud SQL Proxy
# ===========================================

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/crypto-asteroid:$COMMIT_SHA', '.']
  
  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/crypto-asteroid:$COMMIT_SHA']
  
  # 3. Deploy to Cloud Run with all environment variables
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'crypto-asteroid'
    - '--image'
    - 'gcr.io/$PROJECT_ID/crypto-asteroid:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--set-env-vars'
    - |
      MYSQLHOST=127.0.0.1,
      MYSQLPORT=3306,
      MYSQLDATABASE=unobix_db,
      MYSQLUSER=unobix_user,
      MYSQLPASSWORD=YyZD3H)dndSo*A/N,
      FIREBASE_API_KEY=AIzaSyCFUE9xXtbjJGQTz4nGgveWJx6DuhOqD2U,
      FIREBASE_PROJECT_ID=unobix-oauth-a69cd,
      ADMIN_PASSWORD=Admin@Unobix2024!,
      GAME_SECRET_KEY=unobix_production_secret_key_2024_change_me,
      APP_ENV=production,
      DEBUG=false
    - '--add-cloudsql-instances'
    - 'project-7be1cae5-5f08-45fb-aca:us-central1:unobix'
    - '--update-secrets'
    - |
      MYSQL_PASSWORD=projects/234282032979/secrets/mysql-password:latest

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/crypto-asteroid:$COMMIT_SHA'

# Timeout (10 minutes)
timeout: 600s

# Optionally, you can add substitutions for different environments
substitutions:
  _SERVICE_NAME: 'crypto-asteroid'
  _REGION: 'us-central1'