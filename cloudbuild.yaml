steps:
  # 1) Build da imagem (Dockerfile)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'
      - '.'

  # 2) Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'

  # 3) Deploy no Cloud Run usando a imagem (sem --source)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'crypto-asteroid'
      - '--image'
      - 'us-west1-docker.pkg.dev/project-7be1cae5-5f08-45fb-aca/cloud-run-source-deploy/crypto-asteroid:$SHORT_SHA'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - 'project-7be1cae5-5f08-45fb-aca:us-west1:unobix'
      - '--set-env-vars'
      - 'CLOUDSQL_INSTANCE=project-7be1cae5-5f08-45fb-aca:us-west1:unobix,MYSQLHOST=127.0.0.1,MYSQLPORT=3306,MYSQLDATABASE=unobix_db,MYSQLUSER=unobix_user,APP_ENV=production,DEBUG=false'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 900s
