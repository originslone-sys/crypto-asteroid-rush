<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNOBIX | PREPARANDO MISSÃO</title>
    <script src="https://3nbf4.com/act/files/tag.min.js?z=10622094" data-cfasync="false" async></script> Monetag 01
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Game Styles (mantém identidade visual) -->
    <link rel="stylesheet" href="css/game.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Fundo animado com estrelas */
        .stars-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(10, 80, 200, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(100, 0, 200, 0.06) 0%, transparent 50%),
                #0a0a1a;
        }
        
        .stars-bg::before, .stars-bg::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(200,220,255,0.7), transparent),
                radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(200,200,255,0.6), transparent),
                radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 65% 25%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 85% 65%, rgba(220,220,255,0.4), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        
        .stars-bg::after {
            animation-delay: -2s;
            opacity: 0.7;
            transform: scale(1.1);
        }
        
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .pregame-wrapper {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        
        /* Header */
        .pg-header {
            font-family: 'Orbitron', monospace;
            margin-bottom: 24px;
        }
        
        .pg-header .icon {
            font-size: 2.2rem;
            color: #4da6ff;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(77, 166, 255, 0.5);
            animation: pulse-icon 2s ease-in-out infinite;
        }
        
        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pg-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 15px rgba(77, 166, 255, 0.3);
        }
        
        /* Container de Anúncio */
        .ad-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            overflow: hidden;
            position: relative;
        }
        
        .ad-area .ad-fallback {
            color: rgba(255,255,255,0.15);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .ad-area .ad-fallback i { font-size: 2rem; }
        
        .ad-area .ad-label {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Rajdhani', sans-serif;
        }
        
        /* Barra de progresso */
        .progress-section {
            margin-bottom: 20px;
        }
        
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4da6ff, #00d4ff);
            border-radius: 3px;
            transition: width 0.15s linear;
            box-shadow: 0 0 8px rgba(77, 166, 255, 0.4);
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .progress-status {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
        }
        
        .progress-percent {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #4da6ff;
            font-weight: 600;
        }
        
        /* Dica */
        .tip-section {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 200, 0, 0.04);
            border: 1px solid rgba(255, 200, 0, 0.08);
            border-radius: 8px;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.4;
            text-align: left;
        }
        
        .tip-section i {
            color: rgba(255, 200, 0, 0.5);
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        /* Container de ad slot renderizado */
        .ad-area .ad-slot-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="stars-bg"></div>

<div class="pregame-wrapper">
    <!-- Header -->
    <div class="pg-header">
        <div class="icon"><i class="fas fa-satellite-dish"></i></div>
        <h1>BRIEFING DA MISSÃO</h1>
    </div>
    
    <!-- Área de Anúncio -->
    <div id="adContainer" class="ad-area">
        <div class="ad-fallback">
            <i class="fas fa-rocket"></i>
            <span>Preparando nave...</span>
        </div>
        <span class="ad-label">Publicidade</span>
    </div>
    
    <!-- Barra de Progresso -->
    <div class="progress-section">
        <div class="progress-bar-track">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-info">
            <span id="statusText" class="progress-status">Carregando recursos...</span>
            <span id="percentText" class="progress-percent">0%</span>
        </div>
    </div>
    
    <!-- Dica -->
    <div class="tip-section">
        <i class="fas fa-lightbulb"></i>
        <span id="tipText">Destrua asteroides raros para ganhar mais R$!</span>
    </div>
</div>

<!-- AdsManager -->
<script src="js/ads-manager.js"></script>

<script>
(function() {
    'use strict';
    
    const tips = [
        'Destrua asteroides raros para ganhar mais R$!',
        'Asteroides épicos valem muito mais que os comuns!',
        'Lendários são raros mas valem uma fortuna!',
        'Faça staking dos seus ganhos para rendimento automático!',
        'Indique amigos e ganhe comissão por indicação!',
        'Quanto mais missões completar, maiores as recompensas!',
        'Evite colisões para manter suas vidas intactas!',
        'Use a carteira para acompanhar seus ganhos!',
    ];
    
    const statuses = [
        'Carregando recursos...',
        'Inicializando motores...',
        'Calibrando armas...',
        'Escaneando campo de asteroides...',
        'Preparando missão...',
        'Pronto para lançamento!'
    ];
    
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const percentText = document.getElementById('percentText');
    const tipText = document.getElementById('tipText');
    const adContainer = document.getElementById('adContainer');
    
    let adsReady = false;
    let rotationTimer = null;
    
    // Renderizar um slot no container
    function renderSlot(type) {
        if (typeof AdsManager === 'undefined' || !AdsManager.isEnabled?.()) return;
        
        try {
            const slot = AdsManager.getNextSlot?.(type);
            if (slot) {
                adContainer.innerHTML = AdsManager.getSlotHTML?.(slot) || '';
                if (typeof AdsManager.executeScripts === 'function') {
                    AdsManager.executeScripts(adContainer);
                }
                AdsManager.trackImpression?.(slot.id);
                // Manter label
                const label = document.createElement('span');
                label.className = 'ad-label';
                label.textContent = 'Publicidade';
                adContainer.appendChild(label);
            }
        } catch (e) {
            console.warn('📺 Erro ao renderizar slot:', e.message);
        }
    }
    
    // Carregar anúncio e iniciar rotação respeitando duration_seconds por slot
    async function loadAd() {
        try {
            if (typeof AdsManager !== 'undefined') {
                await AdsManager.init();

                if (AdsManager.isEnabled?.()) {
                    const slots = AdsManager.getSlots?.()?.pregame || [];
                    if (slots.length > 0) {
                        adsReady = true;

                        // Renderizar primeiro slot
                        renderSlot('pregame');

                        // Se tem mais de 1 slot, rotacionar respeitando duration_seconds de cada slot
                        if (slots.length > 1) {
                            const fallbackInterval = AdsManager.getConfig?.()?.pregame_rotation_interval || 5;
                            let currentIdx = 0;

                            function scheduleNextSlot() {
                                const currentSlot = slots[currentIdx % slots.length];
                                const slotDuration = (parseInt(currentSlot.duration_seconds) || fallbackInterval) * 1000;

                                rotationTimer = setTimeout(() => {
                                    currentIdx++;
                                    renderSlot('pregame');
                                    scheduleNextSlot();
                                }, slotDuration);
                            }
                            scheduleNextSlot();
                        }
                    }
                }
            }
        } catch (e) {
            console.warn('📺 Erro ao carregar ads:', e.message);
        }
    }
    
    // Determinar duração
    function getDuration() {
        if (adsReady && typeof AdsManager !== 'undefined') {
            return AdsManager.getConfig?.()?.pregame_total_duration || 10;
        }
        return 3; // Sem ads = loading rápido
    }
    
    // Rodar loading
    async function startLoading() {
        await loadAd();
        
        const duration = getDuration();
        const totalSteps = duration * 10;
        let step = 0;
        
        // Rotacionar dica
        let tipIndex = 0;
        
        const interval = setInterval(() => {
            step++;
            const progress = Math.min(100, (step / totalSteps) * 100);
            
            progressBar.style.width = progress + '%';
            percentText.textContent = Math.floor(progress) + '%';
            
            // Status
            const si = Math.min(Math.floor(progress / 20), statuses.length - 1);
            statusText.textContent = statuses[si];
            
            // Rotacionar dica a cada 3s
            if (step % 30 === 0) {
                tipIndex = (tipIndex + 1) % tips.length;
                tipText.textContent = tips[tipIndex];
            }
            
            if (progress >= 100) {
                clearInterval(interval);
                if (rotationTimer) clearTimeout(rotationTimer);

                sessionStorage.setItem('loadingComplete', 'true');
                
                setTimeout(() => {
                    window.location.href = 'game.html?start=true';
                }, 300);
            }
        }, 100);
    }
    
    // Iniciar quando DOM pronto
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startLoading);
    } else {
        startLoading();
    }
})();
</script>

</body>
</html>
