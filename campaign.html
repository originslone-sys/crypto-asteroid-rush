<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Modo Campanha · Unobix</title>
  <link rel="icon" href="favicon.ico" />

  <!-- Fonts (alinha com o resto do site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Exo+2:wght@300;400;500;600;700&display=swap">

  <!-- Font Awesome (ícones do design system) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      color-scheme: dark;

      /* Paleta alinhada com main.css */
      --primary:        #00E5CC;
      --primary-dark:   #00b8a3;
      --secondary:      #7BF542;
      --accent:         #B8FF00;
      --success:        #00FF88;
      --warning:        #ffd166;
      --danger:         #ff4757;
      --info:           #00d4ff;

      --bg:             #0a0a0f;
      --bg-2:           #0f1018;
      --card-bg:        rgba(15, 16, 24, 0.95);
      --card-bg-hover:  rgba(20, 22, 35, 0.98);

      --text:           #ffffff;
      --text-soft:      #e0e0e0;
      --text-dim:       #8892a4;

      --border:         rgba(0, 229, 204, 0.15);
      --border-hover:   rgba(0, 229, 204, 0.4);
      --glow:           0 0 20px rgba(0, 229, 204, 0.3);
      --glow-soft:      0 8px 25px rgba(0, 229, 204, 0.12);

      --gradient-primary: linear-gradient(135deg, #00E5CC, #00FF88);
      --gradient-warm:    linear-gradient(135deg, #ffd166, #ff7e4a);
      --gradient-danger:  linear-gradient(135deg, #ff4757, #ff6b7a);
      --gradient-accent:  linear-gradient(135deg, #B8FF00, #00FF88);

    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      font-family: 'Exo 2', system-ui, -apple-system, sans-serif;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh; min-height: 100dvh;
      overflow: hidden;
      touch-action: pan-y;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: 'Orbitron', monospace; font-weight: 700; }
    .mono { font-family: 'Orbitron', monospace; }

    /* Cosmic background — combina com main.css */
    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(0, 229, 204, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 75%, rgba(123, 245, 66, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(184, 255, 0, 0.05) 0%, transparent 60%),
        #0a0a0f;
    }
    .stage::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(1px 1px at 20% 30%, #fff, transparent),
        radial-gradient(1px 1px at 60% 70%, #00E5CC, transparent),
        radial-gradient(2px 2px at 80% 20%, #fff, transparent),
        radial-gradient(1px 1px at 40% 80%, #B8FF00, transparent);
      background-size: 200px 200px;
      opacity: 0.45;
      pointer-events: none;
      animation: starsTwinkle 8s ease-in-out infinite alternate;
    }
    @keyframes starsTwinkle {
      from { opacity: 0.4; }
      to   { opacity: 0.7; }
    }
    .frame {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      max-width: 100vw;
      max-height: 100dvh;
      border-radius: 20px;
      overflow: hidden;
      background: var(--bg);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 1px var(--border),
        0 0 60px rgba(0, 229, 204, 0.12);
      display: flex; flex-direction: column;
      z-index: 1;
    }
    /* Em telas mobile / tablet menores, o frame ocupa 100% da viewport
       em vez de ficar centralizado em 414x896 com bordas escuras. */
    @media (max-width: 768px) {
      .frame {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100vh;
        max-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .stage { background: var(--bg); }
    }

    /* Header (HUD) sticky com glassmorphism */
    header.hud {
      flex-shrink: 0;
      padding: 14px 16px 12px;
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .hud-row1 { display: flex; align-items: center; gap: 12px; }
    .hud-row1 .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      box-shadow: 0 0 12px rgba(0, 229, 204, 0.35);
      object-fit: cover;
    }
    .hud-row1 .who { flex: 1; min-width: 0; }
    .hud-row1 .who .name {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hud-row1 .who .lvl {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 1px;
    }
    .hud-row1 .who .lvl i { color: var(--warning); margin-right: 3px; }
    .hud-row1 .lvl-big {
      font-family: 'Orbitron', monospace;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      background: rgba(0, 229, 204, 0.08);
      border: 1px solid var(--border-hover);
      border-radius: 10px;
      padding: 4px 14px;
      min-width: 56px;
      text-align: center;
      text-shadow: 0 0 12px rgba(0, 229, 204, 0.5);
    }

    .xp-bar {
      margin-top: 10px;
      height: 8px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .xp-bar > div {
      height: 100%;
      background: var(--gradient-primary);
      transition: width 0.6s ease;
      width: 0%;
      box-shadow: 0 0 8px rgba(0, 229, 204, 0.5);
    }
    .xp-meta {
      display: flex; justify-content: space-between;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }
    .xp-meta .next { color: var(--success); }

    .hud-row2 {
      margin-top: 12px;
      display: flex; gap: 8px; align-items: center;
      font-size: 12px;
    }
    .lives {
      display: flex; align-items: center; gap: 3px;
      letter-spacing: 1px;
    }
    .lives i { font-size: 14px; transition: color 0.2s; }
    .lives i.full  { color: var(--danger); filter: drop-shadow(0 0 4px rgba(255, 71, 87, 0.4)); }
    .lives i.empty { color: rgba(255, 71, 87, 0.18); }
    .lives-meta {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--text-dim);
      margin-left: 4px;
    }
    .hud-action-btn {
      background: rgba(0, 229, 204, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hud-action-btn:hover {
      background: rgba(0, 229, 204, 0.15);
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .credits {
      margin-left: auto;
      display: flex; align-items: center; gap: 5px;
      background: rgba(184, 255, 0, 0.08);
      border: 1px solid rgba(184, 255, 0, 0.3);
      border-radius: 8px;
      padding: 5px 10px;
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      font-size: 12px;
      color: var(--accent);
      box-shadow: 0 0 8px rgba(184, 255, 0, 0.15);
    }
    .credits i { font-size: 13px; }

    /* Map area */
    main.map {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 16px;
    }
    main.map::-webkit-scrollbar { width: 6px; }
    main.map::-webkit-scrollbar-thumb {
      background: var(--border-hover);
      border-radius: 3px;
    }

    .sector {
      position: relative;
      padding: 22px 0 28px;
    }
    .sector + .sector { border-top: 1px solid var(--border); }
    .sector h2 {
      font-family: 'Orbitron', monospace;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      margin: 0 0 6px;
    }
    .sector .subtitle {
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }
    .sector.locked { opacity: 0.5; }
    .sector .locked-banner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 16, 24, 0.95);
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'Orbitron', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--warning);
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.2);
    }

    /* Path com nodes em zigzag */
    .path {
      position: relative;
      padding: 0 18px;
    }
    .node {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      margin: 12px 0;
      cursor: pointer;
      padding: 8px;
      border-radius: 14px;
      transition: all 0.25s ease;
    }
    .node:not(.locked):hover {
      background: rgba(0, 229, 204, 0.06);
      transform: translateX(4px);
    }
    .node.right { flex-direction: row-reverse; text-align: right; }
    .node.right:not(.locked):hover { transform: translateX(-4px); }
    .node .circle {
      flex-shrink: 0;
      width: 64px; height: 64px;
      border-radius: 16px;
      background: var(--gradient-primary);
      border: 2px solid rgba(0, 229, 204, 0.6);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      font-size: 22px;
      color: var(--bg);
      box-shadow:
        0 6px 20px rgba(0, 229, 204, 0.35),
        inset 0 -8px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
    }
    .node:not(.locked):hover .circle {
      transform: scale(1.06) rotate(-3deg);
      box-shadow:
        0 8px 28px rgba(0, 229, 204, 0.55),
        inset 0 -8px 20px rgba(0, 0, 0, 0.2);
    }
    .node.boss .circle {
      background: var(--gradient-warm);
      border-color: rgba(255, 126, 74, 0.7);
      box-shadow:
        0 6px 20px rgba(255, 126, 74, 0.45),
        inset 0 -8px 20px rgba(0, 0, 0, 0.25);
      width: 72px; height: 72px;
      font-size: 26px;
    }
    .node.completed .circle {
      background: var(--gradient-accent);
      border-color: var(--success);
    }
    .node.locked {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .node.locked .circle {
      background: rgba(15, 16, 24, 0.6);
      border: 2px dashed rgba(136, 146, 164, 0.4);
      box-shadow: none;
      color: var(--text-dim);
    }
    .node.locked .circle .label,
    .node.locked .circle i:not(.fa-lock) { display: none; }
    .node.locked .circle::after {
      content: "\f023"; /* fa-lock */
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 22px;
      color: var(--text-dim);
    }

    .node .meta { flex: 1; min-width: 0; }
    .node .meta .name {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .node .meta .stars {
      letter-spacing: 3px;
      font-size: 13px;
      margin-top: 4px;
    }
    .node .meta .stars i.lit { color: var(--warning); filter: drop-shadow(0 0 4px rgba(255, 209, 102, 0.5)); }
    .node .meta .stars i.off { color: rgba(136, 146, 164, 0.25); }
    .node .meta .reward {
      display: flex; align-items: center; gap: 8px;
      color: var(--success);
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }
    .node .meta .reward .sep { color: rgba(136, 146, 164, 0.3); }
    .node .meta .reward .cost { color: var(--accent); }
    .node .meta .req {
      display: flex; align-items: center; gap: 4px;
      color: var(--warning);
      font-size: 10px;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }
    .node.right .meta .reward,
    .node.right .meta .req { justify-content: flex-end; }
    .node .badge-new {
      position: absolute; top: 0; left: 0;
      background: var(--gradient-accent);
      color: var(--bg);
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(184, 255, 0, 0.4);
    }
    .node.right .badge-new { left: auto; right: 0; }

    /* Botão "Acelerar setor" */
    .accelerate-btn {
      display: flex !important;
      align-items: center; justify-content: center; gap: 8px;
      margin: 0 18px 16px;
      padding: 10px 16px !important;
      width: calc(100% - 36px) !important;
      background: linear-gradient(135deg, rgba(0, 229, 204, 0.15), rgba(184, 255, 0, 0.1)) !important;
      border: 1px solid var(--border-hover) !important;
      border-radius: 12px;
      color: var(--primary) !important;
      font-family: 'Orbitron', monospace;
      font-size: 12px !important;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .accelerate-btn:hover {
      background: linear-gradient(135deg, rgba(0, 229, 204, 0.22), rgba(184, 255, 0, 0.15)) !important;
      border-color: var(--primary) !important;
      transform: translateY(-1px);
      box-shadow: var(--glow-soft);
    }

    /* Modais / Overlays */
    .overlay {
      position: absolute; inset: 0;
      background: rgba(10, 10, 15, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .overlay.show { display: flex; animation: overlayIn 0.25s ease-out; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .overlay .card {
      background: var(--card-bg);
      border: 1px solid var(--border-hover);
      border-radius: 18px;
      padding: 26px;
      max-width: 360px; width: 100%;
      text-align: center;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(0, 229, 204, 0.15);
      animation: cardIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .overlay h3 {
      margin: 0 0 6px;
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .overlay .modal-sub {
      margin: 0 0 14px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.5;
    }
    .overlay .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 14px 0 18px;
      font-size: 11px;
    }
    .overlay .grid > div {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      color: var(--text-dim);
    }
    .overlay .grid strong {
      display: block;
      font-family: 'Orbitron', monospace;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .overlay .stars-big {
      font-size: 32px;
      letter-spacing: 10px;
      margin: 10px 0;
    }
    .overlay .stars-big i.lit { color: var(--warning); filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.6)); }
    .overlay .stars-big i.off { color: rgba(136, 146, 164, 0.2); }

    /* Botões */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: rgba(0, 229, 204, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 10px 22px;
      font-family: 'Exo 2', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(0, 229, 204, 0.12);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .btn.primary {
      background: var(--gradient-primary);
      color: var(--bg);
      border: none;
      font-weight: 700;
    }
    .btn.primary:hover {
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }
    .btn.primary:disabled,
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    /* Login overlay (1ª vez) */
    .login-overlay { z-index: 60; }
    .err-msg { color: var(--danger); font-size: 12px; margin-top: 6px; }

    .footer-mini {
      flex-shrink: 0;
      padding: 8px 14px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      border-top: 1px solid var(--border);
      background: rgba(10, 10, 15, 0.85);
      letter-spacing: 0.1em;
    }
    .footer-mini a { color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
    .footer-mini a:hover { color: var(--primary); }
  </style>
</head>
<body>

<div class="stage">
  <div class="frame">

    <!-- HEADER (hud) -->
    <header class="hud">
      <div class="hud-row1">
        <img class="avatar" id="hud-avatar" src="" alt="" style="display:none">
        <div class="who">
          <div class="name" id="hud-name">Carregando...</div>
          <div class="lvl" id="hud-lvl-text">—</div>
        </div>
        <div class="lvl-big" id="hud-lvl">1</div>
      </div>
      <div class="xp-bar"><div id="hud-xp-fill"></div></div>
      <div class="xp-meta">
        <span id="hud-xp-cur">0 XP</span>
        <span class="next" id="hud-xp-next">/ 100 XP</span>
      </div>
      <div class="hud-row2">
        <span class="lives" id="hud-lives" aria-label="Vidas"></span>
        <span class="lives-meta" id="hud-lives-timer"></span>
        <button class="hud-action-btn" id="hud-buy-life" type="button" title="Comprar vidas"
                style="color:var(--danger);border-color:rgba(255,71,87,0.3);background:rgba(255,71,87,0.08)">
          <i class="fas fa-plus"></i>
        </button>
        <button class="hud-action-btn" id="hud-skins" type="button" title="Skins de nave">
          <i class="fas fa-rocket"></i>
        </button>
        <span class="credits" id="hud-credits"><i class="fas fa-coins"></i> 0</span>
      </div>
    </header>

    <!-- MAPA -->
    <main class="map" id="map-root">
      <div style="padding: 60px 20px; text-align: center; color: var(--muted)">
        Carregando mapa...
      </div>
    </main>

    <div class="footer-mini">
      <a href="campaign-debug.html" style="color:var(--muted);text-decoration:none">debug</a>
      <span>·</span>
      <a href="#" id="btn-help" style="color:var(--muted);text-decoration:none">? Ajuda</a>
      <span>·</span>
      <span id="boot-stamp">—</span>
    </div>

    <!-- Modal de fase -->
    <div class="overlay" id="ov-stage">
      <div class="card">
        <h3 id="ov-title">—</h3>
        <p class="modal-sub" id="ov-sub">—</p>
        <div class="stars-big" id="ov-stars">★ ★ ★</div>
        <div class="grid">
          <div><strong id="ov-cost">—</strong>custo</div>
          <div><strong id="ov-reward">—</strong>recompensa</div>
          <div><strong id="ov-best">—</strong>melhor tempo</div>
          <div><strong id="ov-attempts">—</strong>tentativas</div>
        </div>
        <div class="err-msg" id="ov-err"></div>
        <div class="btn-row">
          <button class="btn primary" id="ov-start">Iniciar</button>
          <button class="btn" id="ov-booster" style="display:none;background:#0a2a3a;border-color:#1a4a6a;color:#5cd5ff">Triple Star</button>
          <button class="btn" id="ov-skip" style="display:none;background:#3a2c0c;border-color:#7a5e10;color:#ffd166">Pular</button>
          <button class="btn" id="ov-close">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Login overlay -->
    <div class="overlay login-overlay" id="ov-login">
      <div class="card">
        <h3><i class="fas fa-rocket" style="color:var(--primary)"></i> Modo Campanha</h3>
        <p class="modal-sub">Faça login para acessar o mapa de fases.</p>
        <div class="btn-row">
          <button class="btn primary" id="btn-login">Login com Google</button>
        </div>
      </div>
    </div>

    <!-- Tutorial / Cinemática (slides) -->
    <div class="overlay" id="ov-tutorial" style="z-index:55">
      <div class="card" style="max-width:340px;text-align:center">
        <div id="tut-icon" style="font-size:42px;margin-bottom:6px">🚀</div>
        <h3 id="tut-title">—</h3>
        <p id="tut-text" style="margin:8px 0 14px;line-height:1.5;color:#cad4ff;font-size:13px"></p>
        <div id="tut-progress" style="display:flex;gap:4px;justify-content:center;margin-bottom:12px"></div>
        <div class="btn-row">
          <button class="btn" id="tut-skip" style="font-size:11px;color:#8a93c8">Pular</button>
          <button class="btn primary" id="tut-next">Próximo →</button>
        </div>
      </div>
    </div>

    <!-- Skins overlay -->
    <div class="overlay" id="ov-skins">
      <div class="card" style="max-width:380px">
        <h3><i class="fas fa-rocket" style="color:var(--primary)"></i> Skins de Nave</h3>
        <p class="modal-sub" id="sk-status">—</p>
        <div id="sk-err" style="color:#ff6b6b;font-size:11px;margin-bottom:6px"></div>
        <div id="sk-list" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:380px;overflow-y:auto"></div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn" id="sk-close">Fechar</button>
        </div>
      </div>
    </div>

    <!-- Buy lives overlay -->
    <div class="overlay" id="ov-buy-life">
      <div class="card">
        <h3><i class="fas fa-heart" style="color:var(--danger)"></i> Comprar vidas</h3>
        <p class="modal-sub" id="bl-status">—</p>
        <div id="bl-err" style="color:#ff6b6b;font-size:11px;margin-bottom:6px"></div>
        <div style="display:grid;grid-template-columns:1fr;gap:8px;text-align:left">
          <button class="btn" data-pkg="single">
            <strong>+1 vida</strong> <span style="float:right;color:#ffd166" id="bl-cost-single">—</span>
          </button>
          <button class="btn" data-pkg="pack5">
            <strong>+5 vidas</strong>
            <span style="display:block;font-size:10px;color:#8a93c8">desconto</span>
            <span style="float:right;color:#ffd166;margin-top:-30px" id="bl-cost-pack5">—</span>
          </button>
          <button class="btn" data-pkg="refill">
            <strong>Refill total</strong>
            <span style="display:block;font-size:10px;color:#8a93c8">enche até o máximo</span>
            <span style="float:right;color:#ffd166;margin-top:-30px" id="bl-cost-refill">—</span>
          </button>
        </div>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn" id="bl-close">Fechar</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Firebase compat -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth-manager.js"></script>

<script>
(function () {
  document.getElementById('boot-stamp').textContent = new Date().toISOString().slice(11, 19);

  // ----------------------------------------------------------------------
  // State
  // ----------------------------------------------------------------------
  let cfg = null;       // /api/campaign-config.php
  let prog = null;      // /api/campaign-progress.php
  let user = null;      // saldo de créditos (vem da API extra)
  let liveTimerId = null;

  // ----------------------------------------------------------------------
  // DOM refs
  // ----------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);

  // ----------------------------------------------------------------------
  // Helpers
  // ----------------------------------------------------------------------
  function uid() {
    return window.authManager && window.authManager.currentUser
      ? window.authManager.currentUser.uid
      : null;
  }
  function fmtBrl(v) {
    return 'R$ ' + (Number(v) || 0).toFixed(2).replace('.', ',');
  }
  function fmtTime(seconds) {
    if (seconds == null || seconds < 0) return '—';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }
  function findStage(stageId) {
    if (!cfg) return null;
    return (cfg.stages || []).find(s => s.stage_id === stageId);
  }
  function findStageProgress(stageId) {
    if (!prog) return null;
    return (prog.stages || []).find(s => s.stage_id === stageId) || null;
  }
  function xpForLevel(level) {
    if (!cfg) return 0;
    const row = (cfg.xp_table || []).find(r => r.level === level);
    return row ? row.xp_required : 0;
  }

  // ----------------------------------------------------------------------
  // Header render
  // ----------------------------------------------------------------------
  function renderHeader() {
    const u = window.authManager && window.authManager.currentUser;
    if (u) {
      $('hud-name').textContent = u.displayName || 'Anônimo';
      if (u.photoURL) {
        $('hud-avatar').src = u.photoURL;
        $('hud-avatar').style.display = 'block';
      }
    }
    if (!prog) return;

    const p = prog.progress || {};
    const lives = prog.lives || {};

    // Nível e XP
    $('hud-lvl').textContent = p.current_level || 1;
    const curLvl = p.current_level || 1;
    const nextLvl = curLvl + 1;
    const curXpReq = xpForLevel(curLvl);
    const nextXpReq = xpForLevel(nextLvl) || curXpReq;
    const xpInBracket = (p.total_xp || 0) - curXpReq;
    const xpBracket = nextXpReq - curXpReq;
    const pct = xpBracket > 0 ? Math.min(100, Math.max(0, (xpInBracket / xpBracket) * 100)) : 100;
    $('hud-xp-fill').style.width = pct + '%';
    $('hud-xp-cur').textContent = (p.total_xp || 0) + ' XP';
    $('hud-xp-next').textContent = nextXpReq > curXpReq
      ? '→ Lv ' + nextLvl + ' em ' + (nextXpReq - (p.total_xp || 0)) + ' XP'
      : 'nível máx';
    $('hud-lvl-text').innerHTML = '<i class="fas fa-star"></i> ' + (p.total_stars || 0) + ' totais';

    // Vidas (FontAwesome hearts)
    const max = lives.max || 5;
    const cur = lives.current || 0;
    let hearts = '';
    for (let i = 0; i < max; i++) {
      hearts += '<i class="fas fa-heart ' + (i < cur ? 'full' : 'empty') + '"></i>';
    }
    $('hud-lives').innerHTML = hearts;
    updateLivesTimer();

    // Créditos (ícone fa-coins = ficha; servidor é fonte da verdade)
    const creditsEl = $('hud-credits');
    const c = (user && typeof user.credits === 'number') ? user.credits : '?';
    creditsEl.innerHTML = '<i class="fas fa-coins"></i> ' + c;
  }

  function updateLivesTimer() {
    if (!prog || !prog.lives) return;
    const lives = prog.lives;
    if (lives.current >= lives.max || !lives.next_life_at) {
      $('hud-lives-timer').textContent = '';
      if (liveTimerId) { clearInterval(liveTimerId); liveTimerId = null; }
      return;
    }
    const target = new Date(lives.next_life_at).getTime();
    const tick = () => {
      const sec = Math.max(0, Math.floor((target - Date.now()) / 1000));
      $('hud-lives-timer').textContent = '+1 em ' + fmtTime(sec);
      if (sec <= 0) {
        clearInterval(liveTimerId);
        liveTimerId = null;
        // Recarrega progresso para pegar a vida nova
        loadProgress();
      }
    };
    tick();
    if (liveTimerId) clearInterval(liveTimerId);
    liveTimerId = setInterval(tick, 1000);
  }

  // ----------------------------------------------------------------------
  // Map render
  // ----------------------------------------------------------------------
  const SECTOR_TITLES = {
    1: { title: 'SETOR 1', sub: 'Cinturão de Asteroides' },
    2: { title: 'SETOR 2', sub: 'Zona de Detritos' },
  };

  function renderMap() {
    if (!cfg) return;
    const root = $('map-root');
    root.innerHTML = '';

    // Treino (sector=0) sempre primeiro, fora do agrupamento
    const training = (cfg.stages || []).find(s => s.sector === 0);
    const sectors = [1, 2];

    // Bloco de treino
    if (training) {
      const block = renderSectorBlock({
        title: 'TUTORIAL',
        sub: 'Treine sem perder vida',
        stages: [training],
        locked: false,
      });
      root.appendChild(block);
    }

    for (const sec of sectors) {
      const stages = (cfg.stages || []).filter(s => s.sector === sec);
      if (!stages.length) continue;
      const meta = SECTOR_TITLES[sec] || { title: 'SETOR ' + sec, sub: '' };

      // Bloqueio do Setor 2: vem de cfg.settings['campaign.launch.sector2_enabled']
      let locked = false;
      if (sec === 2) {
        locked = !((cfg.settings || {})['campaign.launch.sector2_enabled'] === true);
      }

      const block = renderSectorBlock({
        title: meta.title,
        sub: meta.sub,
        stages,
        locked,
      });
      root.appendChild(block);
    }
  }

  function renderSectorBlock({ title, sub, stages, locked }) {
    const sec = document.createElement('section');
    sec.className = 'sector' + (locked ? ' locked' : '');

    const h = document.createElement('h2');
    h.textContent = title;
    sec.appendChild(h);
    if (sub) {
      const s = document.createElement('div');
      s.className = 'subtitle';
      s.textContent = sub;
      sec.appendChild(s);
    }

    if (locked) {
      const banner = document.createElement('div');
      banner.className = 'locked-banner';
      banner.innerHTML = '<i class="fas fa-lock"></i> Em breve';
      sec.appendChild(banner);
    }

    // Botão "Acelerar setor" (só para setores 1 e 2 desbloqueados,
    // se ainda houver fases sem 1⭐)
    const sectorNum = stages[0] && stages[0].sector;
    if (!locked && (sectorNum === 1 || sectorNum === 2) && cfg && prog) {
      const allHaveStar = stages.every(s => {
        const sp = findStageProgress(s.stage_id);
        return sp && sp.stars >= 1;
      });
      if (!allHaveStar) {
        const cost = (cfg.settings || {})['campaign.monetization.accelerate_s' + sectorNum]
                     ?? (sectorNum === 1 ? 20 : 30);
        const promo = document.createElement('button');
        promo.type = 'button';
        promo.className = 'accelerate-btn';
        promo.innerHTML =
          '<i class="fas fa-bolt"></i>' +
          '<span>Acelerar setor —</span>' +
          '<span style="color:var(--accent)"><i class="fas fa-coins"></i> ' + cost + '</span>';
        promo.addEventListener('click', () => attemptAccelerateSector(sectorNum, cost));
        sec.appendChild(promo);
      }
    }

    const path = document.createElement('div');
    path.className = 'path';
    stages.forEach((stage, idx) => {
      path.appendChild(renderNode(stage, idx, locked));
    });
    sec.appendChild(path);

    return sec;
  }

  async function attemptAccelerateSector(sector, cost) {
    if (!confirm('Acelerar Setor ' + sector + ' por ' + cost + ' créditos?\n\nVocê ganhará 1⭐ em todas as fases ainda não vencidas.\nNão paga BRL — apenas desbloqueia. Você pode re-jogar para 2⭐/3⭐.')) return;
    try {
      const fd = new FormData();
      fd.set('google_uid', uid());
      fd.set('sector', String(sector));
      const r = await fetch('/api/campaign-accelerate-sector.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) { alert(data.error || 'Falha'); return; }
      if (user) user.credits = data.data.remaining_credits;
      await loadProgress();
      renderHeader();
      renderMap();
      alert('Setor desbloqueado! +' + data.data.stars_added + '⭐');
    } catch (e) { alert('Erro: ' + e.message); }
  }

  function renderNode(stage, idx, sectorLocked) {
    const sp = findStageProgress(stage.stage_id);
    const stars = sp ? sp.stars : 0;
    const isBoss = !!stage.is_boss;
    const playerLevel = (prog && prog.progress && prog.progress.current_level) || 1;
    const levelLocked = playerLevel < (stage.min_level || 1);
    const locked = sectorLocked || levelLocked;
    const isNew = !levelLocked && !sp; // desbloqueada e nunca jogada

    const node = document.createElement('div');
    node.className = 'node ' + (idx % 2 === 1 ? 'right' : '') + (isBoss ? ' boss' : '') + (locked ? ' locked' : '');

    const circle = document.createElement('div');
    circle.className = 'circle';
    if (!locked) {
      const label = document.createElement('span');
      label.className = 'label';
      if (isBoss) {
        label.innerHTML = '<i class="fas fa-skull"></i>';
      } else if (stage.sector === 0) {
        label.innerHTML = '<i class="fas fa-graduation-cap"></i>';
      } else {
        label.textContent = stage.order || '?';
      }
      circle.appendChild(label);
    }
    node.appendChild(circle);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = stage.name;
    meta.appendChild(name);

    const starsDiv = document.createElement('div');
    starsDiv.className = 'stars';
    starsDiv.innerHTML = [0, 1, 2].map(i =>
      '<i class="fas fa-star ' + (i < stars ? 'lit' : 'off') + '"></i>'
    ).join(' ');
    meta.appendChild(starsDiv);

    if (locked && levelLocked && !sectorLocked) {
      const req = document.createElement('div');
      req.className = 'req';
      req.innerHTML = '<i class="fas fa-lock"></i> Requer nível ' + stage.min_level;
      meta.appendChild(req);
    } else if (!locked) {
      const reward = document.createElement('div');
      reward.className = 'reward';
      reward.innerHTML = stage.brl_base > 0
        ? '<span><i class="fas fa-money-bill-wave"></i> ' + fmtBrl(stage.brl_base) + '</span>' +
          '<span class="sep">·</span>' +
          '<span class="cost"><i class="fas fa-coins"></i> ' + stage.credit_cost + '</span>'
        : '<span style="color:var(--text-dim)">Treino</span>' +
          '<span class="sep">·</span>' +
          '<span class="cost"><i class="fas fa-coins"></i> ' + stage.credit_cost + '</span>';
      meta.appendChild(reward);
    }
    node.appendChild(meta);

    if (isNew) {
      const tag = document.createElement('div');
      tag.className = 'badge-new';
      tag.textContent = 'NOVO';
      node.appendChild(tag);
    }

    if (!locked) {
      node.addEventListener('click', () => openStageModal(stage));
    }
    return node;
  }

  // ----------------------------------------------------------------------
  // Modal de fase
  // ----------------------------------------------------------------------
  function openStageModal(stage) {
    const sp = findStageProgress(stage.stage_id) || { stars: 0, attempts: 0, best_time: null };
    $('ov-title').textContent = stage.name;
    $('ov-sub').textContent = stage.is_boss ? 'BOSS — ' + stage.description : (stage.description || 'Setor ' + stage.sector);

    // Stars (FontAwesome)
    $('ov-stars').innerHTML = [0, 1, 2].map(i =>
      '<i class="fas fa-star ' + (i < sp.stars ? 'lit' : 'off') + '"></i>'
    ).join(' ');

    // Grid
    $('ov-cost').innerHTML       = '<i class="fas fa-coins"></i> ' + stage.credit_cost;
    $('ov-reward').textContent   = stage.brl_base > 0 ? fmtBrl(stage.brl_base) : '—';
    $('ov-best').textContent     = sp.best_time != null ? sp.best_time + 's' : '—';
    $('ov-attempts').textContent = sp.attempts || 0;

    // Validações pré-jogada
    const lives = (prog && prog.lives) || {};
    const hasLives = (lives.current || 0) > 0;
    const hasCredits = !user || (typeof user.credits !== 'number') || user.credits >= stage.credit_cost;

    let err = '';
    if (!hasLives) err = 'Sem vidas disponíveis. Aguarde recarga.';
    else if (!hasCredits) err = 'Créditos insuficientes (' + (user.credits || 0) + ' / ' + stage.credit_cost + ').';
    $('ov-err').textContent = err;
    $('ov-start').disabled = !!err;
    $('ov-start').onclick = () => {
      window.location.href = 'campaign-game.html?stage=' + encodeURIComponent(stage.stage_id);
    };

    // Skip stage: aparece após N tentativas falhas, se nunca venceu
    const skipMin = (cfg.settings || {})['campaign.monetization.skip_attempts'] ?? 3;
    const skipCost = (cfg.settings || {})['campaign.monetization.skip_cost'] ?? 5;
    const skipBtn = $('ov-skip');
    if (sp.attempts >= skipMin && (sp.wins == null || sp.wins === 0)) {
      skipBtn.style.display = 'inline-flex';
      skipBtn.innerHTML = '<i class="fas fa-forward"></i> Pular (<i class="fas fa-coins"></i> ' + skipCost + ')';
      skipBtn.onclick = () => attemptSkipStage(stage, skipCost);
    } else {
      skipBtn.style.display = 'none';
    }

    // Booster: mostra info se já tem armado, ou botão para comprar
    const boosterBtn = $('ov-booster');
    const pendingBooster = (prog && prog.progress && prog.progress.pending_booster) || null;
    if (pendingBooster === 'triple_star') {
      boosterBtn.innerHTML = '<i class="fas fa-shield-halved"></i> Triple Star armado';
      boosterBtn.disabled = true;
      boosterBtn.style.display = 'inline-flex';
    } else {
      const boosterCost = (cfg.settings || {})['campaign.monetization.booster_cost'] ?? 3;
      boosterBtn.innerHTML = '<i class="fas fa-shield-halved"></i> Triple Star (<i class="fas fa-coins"></i> ' + boosterCost + ')';
      boosterBtn.disabled = false;
      boosterBtn.style.display = 'inline-flex';
      boosterBtn.onclick = attemptBuyBooster;
    }

    $('ov-stage').classList.add('show');
  }

  async function attemptBuyBooster() {
    const u = uid();
    if (!u) return;
    const cost = (cfg.settings || {})['campaign.monetization.booster_cost'] ?? 3;
    if (!confirm('Comprar Triple Star Booster por ' + cost + ' créditos?\n\nA próxima fase começará com escudo ativo (bloqueia 1 dano).')) return;
    try {
      const fd = new FormData();
      fd.set('google_uid', u);
      fd.set('type', 'triple_star');
      const r = await fetch('/api/campaign-buy-booster.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) { alert(data.error || 'Falha'); return; }
      if (user) user.credits = data.data.remaining_credits;
      renderHeader();
      alert('Booster armado! Inicie a próxima fase para usar.');
      // Recarrega progress para o modal saber que tem booster pendente
      await loadProgress();
      renderMap();
    } catch (e) { alert('Erro: ' + e.message); }
  }

  async function attemptSkipStage(stage, cost) {
    if (!confirm('Pular fase ' + stage.name + ' por ' + cost + ' créditos? Você ganha 1⭐ automaticamente. Pode re-jogar depois para 2⭐/3⭐.')) return;
    try {
      const fd = new FormData();
      fd.set('google_uid', uid());
      fd.set('stage_id', stage.stage_id);
      const r = await fetch('/api/campaign-skip-stage.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) { alert(data.error || 'Falha'); return; }
      closeStageModal();
      // Atualiza progress
      await loadProgress();
      if (user) user.credits = data.data.remaining_credits;
      renderHeader();
      renderMap();
      alert('Fase pulada! +' + data.data.stars + '⭐ e R$ ' + Number(data.data.brl_awarded).toFixed(2).replace('.', ','));
    } catch (e) { alert('Erro: ' + e.message); }
  }
  function closeStageModal() {
    $('ov-stage').classList.remove('show');
  }
  $('ov-close').addEventListener('click', closeStageModal);
  $('ov-stage').addEventListener('click', (e) => {
    if (e.target.id === 'ov-stage') closeStageModal();
  });

  // ----------------------------------------------------------------------
  // Tutorial (welcome slides, cinematics, tooltips)
  // ----------------------------------------------------------------------
  let tutorialSeen = new Set();
  let tutorialPlaying = null;

  const WELCOME_SLIDES = [
    { icon: '🚀', title: 'Bem-vindo à Campanha!',
      text: 'Embarque em uma jornada espacial com 11 fases divididas em 2 setores. Encare ondas de inimigos e enfrente bosses com 3 fases de HP.' },
    { icon: '❤', title: 'Sistema de Vidas',
      text: 'Você começa com 5 vidas. Vidas só são consumidas em derrotas. Se ficar sem, espere a recarga (30 min cada) ou compre mais com créditos.' },
    { icon: '⭐', title: 'XP e Estrelas',
      text: 'Cada fase dá XP fixa que sobe seu nível. Para 3⭐, complete sem tomar dano. Para 2⭐, perca no máximo metade do HP.' },
    { icon: '🎁', title: 'Power-ups',
      text: 'Inimigos podem dropar escudo, reparo, tiro triplo, slow-time ou bombas. Pegue passando a nave por cima!' },
  ];

  const CINEMATIC_SECTOR2 = [
    { icon: '🌌', title: 'Setor 1 conquistado',
      text: 'Você atravessou o cinturão de asteroides. Mas o que vem agora são destroços de uma guerra antiga...' },
    { icon: '☠', title: 'Zona de Detritos',
      text: 'Sucata blindada, naves piratas e alienígenas mais agressivos. O Devorador de Sucata espreita as profundezas.' },
  ];

  async function loadTutorialSeen() {
    const u = uid();
    if (!u) return;
    try {
      const r = await fetch('/api/campaign-tutorial.php?google_uid=' + encodeURIComponent(u));
      const data = await r.json();
      if (data.success) tutorialSeen = new Set(data.data.seen || []);
    } catch (_) {}
  }

  async function markTutorialSeen(key) {
    tutorialSeen.add(key);
    try {
      const fd = new FormData();
      fd.set('google_uid', uid());
      fd.set('key', key);
      await fetch('/api/campaign-tutorial.php', { method: 'POST', body: fd });
    } catch (_) {}
  }

  function showTutorial(key, slides, persistent) {
    tutorialPlaying = { key, slides, idx: 0, persistent: persistent !== false };
    renderTutorialSlide();
    document.getElementById('ov-tutorial').classList.add('show');
  }

  function renderTutorialSlide() {
    if (!tutorialPlaying) return;
    const s = tutorialPlaying.slides[tutorialPlaying.idx];
    document.getElementById('tut-icon').textContent  = s.icon;
    document.getElementById('tut-title').textContent = s.title;
    document.getElementById('tut-text').textContent  = s.text;
    document.getElementById('tut-next').textContent =
      (tutorialPlaying.idx === tutorialPlaying.slides.length - 1) ? 'Vamos lá ✓' : 'Próximo →';
    const dots = document.getElementById('tut-progress');
    dots.innerHTML = '';
    for (let i = 0; i < tutorialPlaying.slides.length; i++) {
      const d = document.createElement('span');
      d.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' +
        (i === tutorialPlaying.idx ? 'var(--accent)' : '#2a3375');
      dots.appendChild(d);
    }
  }

  function advanceTutorial() {
    if (!tutorialPlaying) return;
    if (tutorialPlaying.idx < tutorialPlaying.slides.length - 1) {
      tutorialPlaying.idx += 1;
      renderTutorialSlide();
    } else {
      finishTutorial();
    }
  }

  function finishTutorial() {
    if (!tutorialPlaying) return;
    if (tutorialPlaying.persistent) markTutorialSeen(tutorialPlaying.key);
    document.getElementById('ov-tutorial').classList.remove('show');
    tutorialPlaying = null;
  }

  document.getElementById('tut-next').addEventListener('click', advanceTutorial);
  document.getElementById('tut-skip').addEventListener('click', finishTutorial);

  async function checkPendingTutorials() {
    if (!prog) return;
    if (!tutorialSeen.has('welcome')) {
      showTutorial('welcome', WELCOME_SLIDES);
      return;
    }
    const sector2On = (cfg.settings || {})['campaign.launch.sector2_enabled'] === true;
    if (sector2On && !tutorialSeen.has('cinematic_sector1to2')) {
      const completedSector1 = (prog.stages || []).some(s =>
        /^s1/.test(s.stage_id) && s.stars >= 1);
      if (completedSector1) {
        showTutorial('cinematic_sector1to2', CINEMATIC_SECTOR2);
        return;
      }
    }
    // Tooltip contextual: 1ª vez sem vidas
    if (!tutorialSeen.has('tooltip_no_lives')
        && prog.lives && (prog.lives.current === 0)) {
      showTutorial('tooltip_no_lives', [{
        icon: '🤍', title: 'Sem vidas',
        text: 'Suas vidas acabaram! Você pode esperar a recarga (30 min cada) ou comprar mais clicando no botão + ao lado das vidas.',
      }]);
      return;
    }
    // Tooltip contextual: 1ª 3⭐
    if (!tutorialSeen.has('tooltip_first_3stars')) {
      const has3 = (prog.stages || []).some(s => s.stars >= 3);
      if (has3) {
        showTutorial('tooltip_first_3stars', [{
          icon: '⭐⭐⭐', title: 'Perfeição!',
          text: 'Você fez 3⭐ pela primeira vez. Cada estrela aumenta o BRL ganho. Tente fazer 3⭐ em todas as fases!',
        }]);
        return;
      }
    }
  }

  // Botão de ajuda no rodapé reabre o welcome (não persiste)
  document.getElementById('btn-help').addEventListener('click', (e) => {
    e.preventDefault();
    showTutorial('welcome_review', WELCOME_SLIDES, false);
  });

  // ----------------------------------------------------------------------
  // Buy lives modal
  // ----------------------------------------------------------------------
  function openBuyLifeModal() {
    if (!cfg) return;
    const settings = cfg.settings || {};
    // Custos vêm de campaign_settings (defaults se ausentes)
    const costSingle = settings['campaign.lives.cost_single']  ?? 1;
    const costPack5  = settings['campaign.lives.cost_pack5']   ?? 4;
    const costRefill = settings['campaign.lives.cost_refill']  ?? 3;
    document.getElementById('bl-cost-single').innerHTML = '<i class="fas fa-coins"></i> ' + costSingle;
    document.getElementById('bl-cost-pack5').innerHTML  = '<i class="fas fa-coins"></i> ' + costPack5;
    document.getElementById('bl-cost-refill').innerHTML = '<i class="fas fa-coins"></i> ' + costRefill;
    const lives = (prog && prog.lives) || {};
    document.getElementById('bl-status').textContent =
      'Vidas atuais: ' + (lives.current ?? '?') + ' / ' + (lives.max ?? '?');
    document.getElementById('bl-err').textContent = '';
    document.getElementById('ov-buy-life').classList.add('show');
  }
  function closeBuyLifeModal() {
    document.getElementById('ov-buy-life').classList.remove('show');
  }
  async function buyLife(pkg) {
    const u = uid();
    if (!u) return;
    const errEl = document.getElementById('bl-err');
    errEl.textContent = '';
    try {
      const fd = new FormData();
      fd.set('google_uid', u);
      fd.set('package', pkg);
      const r = await fetch('/api/campaign-buy-life.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) {
        errEl.textContent = data.error || 'Falha';
        return;
      }
      // Atualiza local cache de progresso e créditos
      if (prog && prog.lives) {
        prog.lives.current      = data.data.lives.current;
        prog.lives.max          = data.data.lives.max;
        prog.lives.next_life_at = data.data.lives.next_life_at;
        if (prog.progress) prog.progress.current_lives = data.data.lives.current;
      }
      if (user) user.credits = data.data.remaining_credits;
      else user = { credits: data.data.remaining_credits };
      renderHeader();
      // Recarrega progress full para sincronizar 100% com o servidor
      loadProgress().then(() => { renderHeader(); renderMap(); }).catch(() => {});
      closeBuyLifeModal();
    } catch (e) {
      errEl.textContent = 'Erro de rede: ' + e.message;
    }
  }
  // ----------------------------------------------------------------------
  // Skins modal
  // ----------------------------------------------------------------------
  let skinsCache = null;

  async function openSkinsModal() {
    const u = uid();
    if (!u) return;
    document.getElementById('sk-err').textContent = '';
    document.getElementById('sk-status').textContent = 'Carregando...';
    document.getElementById('sk-list').innerHTML = '';
    document.getElementById('ov-skins').classList.add('show');
    try {
      const r = await fetch('/api/campaign-skins.php?google_uid=' + encodeURIComponent(u));
      const data = await r.json();
      if (!data.success) {
        document.getElementById('sk-err').textContent = data.error || 'Falha';
        document.getElementById('sk-status').textContent = '';
        return;
      }
      skinsCache = data.data.skins;
      renderSkinsList();
    } catch (e) {
      document.getElementById('sk-err').textContent = 'Erro: ' + e.message;
    }
  }

  function renderSkinsList() {
    const credits = (user && typeof user.credits === 'number') ? user.credits : null;
    document.getElementById('sk-status').innerHTML =
      'Saldo: ' + (credits != null ? '<i class="fas fa-coins" style="color:var(--accent)"></i> ' + credits : '?');
    const list = document.getElementById('sk-list');
    list.innerHTML = '';
    for (const s of skinsCache) {
      const card = document.createElement('div');
      card.style.cssText =
        'background:#0a0f30;border:1px solid ' + (s.equipped ? '#5cd5ff' : '#2a3375') +
        ';border-radius:8px;padding:10px;text-align:center';
      card.innerHTML =
        '<img src="' + s.sprite_path + '" style="width:64px;height:64px;display:block;margin:0 auto 6px">' +
        '<div style="font-size:12px;font-weight:600">' + s.name + '</div>' +
        '<div style="font-size:10px;color:#8a93c8;margin:4px 0;min-height:24px">' + (s.description || '') + '</div>' +
        '<div id="sk-action-' + s.skin_key + '"></div>';
      list.appendChild(card);

      const slot = card.querySelector('#sk-action-' + s.skin_key);
      if (s.equipped) {
        slot.innerHTML = '<span style="color:#5fdb91;font-size:11px">✓ Equipada</span>';
      } else if (s.owned) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.style.cssText = 'padding:5px 10px;font-size:11px;width:100%';
        btn.textContent = 'Equipar';
        btn.addEventListener('click', () => doSkinAction('equip', s.skin_key));
        slot.appendChild(btn);
      } else {
        const btn = document.createElement('button');
        btn.className = 'btn primary';
        btn.style.cssText = 'padding:5px 10px;font-size:11px;width:100%';
        btn.innerHTML = 'Comprar (<i class="fas fa-coins"></i> ' + s.credit_cost + ')';
        btn.addEventListener('click', () => doSkinAction('buy', s.skin_key));
        slot.appendChild(btn);
      }
    }
  }

  async function doSkinAction(action, skinKey) {
    const u = uid();
    if (!u) return;
    const errEl = document.getElementById('sk-err');
    errEl.textContent = '';
    try {
      const fd = new FormData();
      fd.set('google_uid', u);
      fd.set('action', action);
      fd.set('skin_key', skinKey);
      const r = await fetch('/api/campaign-skins.php', { method: 'POST', body: fd });
      const data = await r.json();
      if (!data.success) { errEl.textContent = data.error || 'Falha'; return; }
      if (action === 'buy' && user && typeof data.data.remaining_credits === 'number') {
        user.credits = data.data.remaining_credits;
      }
      // Recarrega lista de skins e progresso
      await openSkinsModal();
      await loadProgress();
      renderHeader();
    } catch (e) {
      errEl.textContent = 'Erro: ' + e.message;
    }
  }

  document.getElementById('hud-skins').addEventListener('click', openSkinsModal);
  document.getElementById('sk-close').addEventListener('click', () => {
    document.getElementById('ov-skins').classList.remove('show');
  });
  document.getElementById('ov-skins').addEventListener('click', (e) => {
    if (e.target.id === 'ov-skins') document.getElementById('ov-skins').classList.remove('show');
  });

  document.getElementById('hud-buy-life').addEventListener('click', openBuyLifeModal);
  document.getElementById('bl-close').addEventListener('click', closeBuyLifeModal);
  document.getElementById('ov-buy-life').addEventListener('click', (e) => {
    if (e.target.id === 'ov-buy-life') closeBuyLifeModal();
  });
  document.querySelectorAll('#ov-buy-life [data-pkg]').forEach(btn => {
    btn.addEventListener('click', () => buyLife(btn.getAttribute('data-pkg')));
  });

  // ----------------------------------------------------------------------
  // API fetching
  // ----------------------------------------------------------------------
  async function loadConfig() {
    const r = await fetch('/api/campaign-config.php', { headers: { 'Accept': 'application/json' } });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'config falhou');
    cfg = data.data;
  }

  async function loadProgress() {
    const u = uid();
    if (!u) return;
    const r = await fetch('/api/campaign-progress.php?google_uid=' + encodeURIComponent(u));
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'progress falhou');
    prog = data.data;
    // Saldo do user vem junto no progress (mesma chamada, menos round-trips)
    if (prog.user) {
      user = { credits: prog.user.credits, balance_brl: prog.user.balance_brl };
    }
  }

  // ----------------------------------------------------------------------
  // Boot
  // ----------------------------------------------------------------------
  async function refreshAll() {
    try {
      if (!cfg) await loadConfig();
      await Promise.all([loadProgress(), loadTutorialSeen()]);
      renderHeader();
      renderMap();
      checkPendingTutorials();
    } catch (e) {
      $('map-root').innerHTML =
        '<div style="padding:40px 20px;color:var(--err);text-align:center">Erro: ' +
        (e && e.message ? e.message : e) + '</div>';
    }
  }

  function refreshOnAuth(authedUser) {
    if (authedUser) {
      $('ov-login').classList.remove('show');
      refreshAll();
    } else {
      $('ov-login').classList.add('show');
    }
  }

  function bindAuth(retries = 50) {
    if (!window.authManager) {
      if (retries <= 0) return;
      setTimeout(() => bindAuth(retries - 1), 100);
      return;
    }
    window.authManager.onAuthStateChanged(refreshOnAuth);
    refreshOnAuth(window.authManager.currentUser);
  }

  $('btn-login').addEventListener('click', () => window.authManager && window.authManager.signIn());

  // Recarrega progress quando o usuário volta para a aba (ex: após terminar fase)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && uid()) {
      loadProgress().then(() => { renderHeader(); renderMap(); }).catch(() => {});
    }
  });

  bindAuth();
})();
</script>

</body>
</html>
