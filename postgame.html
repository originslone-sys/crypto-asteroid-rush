<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNOBIX | FINALIZANDO MISSÃO</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Game Styles -->
    <link rel="stylesheet" href="css/game.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a1a;
            color: #e0e0ff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Fundo animado */
        .stars-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(0, 200, 100, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(255, 180, 0, 0.05) 0%, transparent 50%),
                #0a0a1a;
        }
        
        .stars-bg::before, .stars-bg::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(200,220,255,0.7), transparent),
                radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 15% 85%, rgba(200,200,255,0.6), transparent),
                radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 65% 25%, rgba(255,255,255,0.5), transparent);
            animation: twinkle 4s ease-in-out infinite alternate;
        }
        
        .stars-bg::after {
            animation-delay: -2s;
            opacity: 0.7;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        
        .postgame-wrapper {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        
        /* Header */
        .pg-header {
            font-family: 'Orbitron', monospace;
            margin-bottom: 24px;
        }
        
        .pg-header .icon {
            font-size: 2.2rem;
            color: #00d68f;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 214, 143, 0.5);
            animation: pulse-icon 2s ease-in-out infinite;
        }
        
        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pg-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 214, 143, 0.3);
        }
        
        /* Mini resumo */
        .mini-summary {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
            font-family: 'Orbitron', monospace;
        }
        
        .mini-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .mini-stat .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        
        .mini-stat .value.earnings {
            color: #00d68f;
        }
        
        .mini-stat .label {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        /* Container de Anúncio */
        .ad-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            overflow: hidden;
            position: relative;
        }
        
        .ad-area .ad-fallback {
            color: rgba(255,255,255,0.15);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .ad-area .ad-fallback i { font-size: 2rem; }
        
        .ad-area .ad-label {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Barra de progresso */
        .progress-section {
            margin-bottom: 20px;
        }
        
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d68f, #00e6a0);
            border-radius: 3px;
            transition: width 0.15s linear;
            box-shadow: 0 0 8px rgba(0, 214, 143, 0.4);
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .progress-status {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            font-weight: 500;
        }
        
        .progress-percent {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: #00d68f;
            font-weight: 600;
        }
        
        /* Dica */
        .tip-section {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(255, 200, 0, 0.04);
            border: 1px solid rgba(255, 200, 0, 0.08);
            border-radius: 8px;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.55);
            line-height: 1.4;
            text-align: left;
        }
        
        .tip-section i {
            color: rgba(255, 200, 0, 0.5);
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .ad-area .ad-slot-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="stars-bg"></div>

<div class="postgame-wrapper">
    <!-- Header -->
    <div class="pg-header">
        <div class="icon"><i class="fas fa-flag-checkered"></i></div>
        <h1>MISSÃO FINALIZADA</h1>
    </div>
    
    <!-- Mini resumo (score + earnings) -->
    <div class="mini-summary">
        <div class="mini-stat">
            <span id="miniScore" class="value">0</span>
            <span class="label">Asteroides</span>
        </div>
        <div class="mini-stat">
            <span id="miniEarnings" class="value earnings">R$ 0,00</span>
            <span class="label">Ganhos</span>
        </div>
    </div>
    
    <!-- Área de Anúncio -->
    <div id="adContainer" class="ad-area">
        <div class="ad-fallback">
            <i class="fas fa-trophy"></i>
            <span>Processando resultados...</span>
        </div>
        <span class="ad-label">Publicidade</span>
    </div>
    
    <!-- Barra de Progresso -->
    <div class="progress-section">
        <div class="progress-bar-track">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-info">
            <span id="statusText" class="progress-status">Calculando resultados...</span>
            <span id="percentText" class="progress-percent">0%</span>
        </div>
    </div>
    
    <!-- Dica -->
    <div class="tip-section">
        <i class="fas fa-lightbulb"></i>
        <span id="tipText">Faça staking dos seus ganhos para rendimento automático!</span>
    </div>
</div>

<!-- AdsManager -->
<script src="js/ads-manager.js"></script>

<script>
(function() {
    'use strict';
    
    const tips = [
        'Faça staking dos seus ganhos para rendimento automático!',
        'Indique amigos e ganhe comissão quando eles jogarem!',
        'Quanto mais missões, melhores suas recompensas!',
        'Saque seus ganhos direto para Pix quando quiser!',
        'Jogue diariamente para maximizar seus ganhos!',
        'Asteroides lendários pagam as maiores recompensas!',
        'Acumule saldo e faça staking para ganhar mais!',
    ];
    
    const statuses = [
        'Calculando resultados...',
        'Verificando asteroides destruídos...',
        'Processando recompensas...',
        'Atualizando ranking...',
        'Finalizando...',
        'Resultados prontos!'
    ];
    
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const percentText = document.getElementById('percentText');
    const tipText = document.getElementById('tipText');
    const adContainer = document.getElementById('adContainer');
    const miniScore = document.getElementById('miniScore');
    const miniEarnings = document.getElementById('miniEarnings');
    
    // Carregar mini resumo do sessionStorage
    try {
        const pgData = JSON.parse(sessionStorage.getItem('postgameData') || '{}');
        if (pgData.score !== undefined) {
            miniScore.textContent = pgData.score;
        }
        if (pgData.earnings !== undefined) {
            const val = parseFloat(pgData.earnings);
            miniEarnings.textContent = 'R$ ' + val.toFixed(6).replace('.', ',');
        }
    } catch (e) {}
    
    let adsReady = false;
    let rotationTimer = null;
    
    // Renderizar um slot no container
    function renderSlot(type) {
        if (typeof AdsManager === 'undefined' || !AdsManager.isEnabled?.()) return;
        
        try {
            const slot = AdsManager.getNextSlot?.(type);
            if (slot) {
                adContainer.innerHTML = AdsManager.getSlotHTML?.(slot) || '';
                if (typeof AdsManager.executeScripts === 'function') {
                    AdsManager.executeScripts(adContainer);
                }
                AdsManager.trackImpression?.(slot.id);
                const label = document.createElement('span');
                label.className = 'ad-label';
                label.textContent = 'Publicidade';
                adContainer.appendChild(label);
            }
        } catch (e) {
            console.warn('📺 Erro ao renderizar slot:', e.message);
        }
    }
    
    // Carregar anúncio endgame e iniciar rotação
    async function loadAd() {
        try {
            if (typeof AdsManager !== 'undefined') {
                await AdsManager.init();
                
                if (AdsManager.isEnabled?.()) {
                    const slots = AdsManager.getSlots?.()?.endgame || [];
                    if (slots.length > 0) {
                        adsReady = true;
                        
                        // Renderizar primeiro slot
                        renderSlot('endgame');
                        
                        // Se tem mais de 1 slot, rotacionar
                        if (slots.length > 1) {
                            const rotInterval = (AdsManager.getConfig?.()?.endgame_rotation_interval || 8) * 1000;
                            rotationTimer = setInterval(() => renderSlot('endgame'), rotInterval);
                        }
                    }
                }
            }
        } catch (e) {
            console.warn('📺 Erro ao carregar ads:', e.message);
        }
    }
    
    function getDuration() {
        if (adsReady && typeof AdsManager !== 'undefined') {
            return AdsManager.getConfig?.()?.endgame_rotation_interval || 8;
        }
        return 3;
    }
    
    async function startLoading() {
        await loadAd();
        
        const duration = getDuration();
        const totalSteps = duration * 10;
        let step = 0;
        let tipIndex = 0;
        
        const interval = setInterval(() => {
            step++;
            const progress = Math.min(100, (step / totalSteps) * 100);
            
            progressBar.style.width = progress + '%';
            percentText.textContent = Math.floor(progress) + '%';
            
            const si = Math.min(Math.floor(progress / 20), statuses.length - 1);
            statusText.textContent = statuses[si];
            
            if (step % 30 === 0) {
                tipIndex = (tipIndex + 1) % tips.length;
                tipText.textContent = tips[tipIndex];
            }
            
        if (progress >= 100) {
            clearInterval(interval);
            if (rotationTimer) clearInterval(rotationTimer);
            
            sessionStorage.setItem('postgameComplete', 'true');
            
            setTimeout(() => {
                window.location.href = 'game.html?results=true';
            }, 300);
        }
        }, 100);
    }
    
    // Verificar se tem dados — se não tem, voltar pro game
    const pgData = sessionStorage.getItem('postgameData');
    if (!pgData) {
        window.location.href = 'game.html';
    } else {
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startLoading);
        } else {
            startLoading();
        }
    }
})();
</script>

</body>
</html>
